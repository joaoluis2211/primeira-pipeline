name: Primeira Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  COBERTURA_MINIMA: '90'
  PYTHON_PADRAO: '3.12'

jobs:
  build:
    name: Build - gerar e publicar ZIP
    runs-on: ubuntu-24.04
    outputs:
      artifact-id: ${{ steps.publicar.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_PADRAO }}
      - name: Verificar sintaxe
        run: python -m py_compile app.py
      - name: Empacotar arquivos versionados
        run: >-
          git archive --format=zip --output=pipeline-demo.zip HEAD
          app.py tests_app.py requirements.txt .coveragerc sonar-project.properties
      - name: Publicar artefato
        id: publicar
        uses: actions/upload-artifact@v7.0.2
        with:
          name: codigo-buildado
          path: pipeline-demo.zip
          if-no-files-found: error
          retention-days: 7

  qualidade:
    needs: build
    name: Qualidade (${{ matrix.os }}, Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Baixar o artefato do build
        uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: artefato
          merge-multiple: true
      - name: Extrair o artefato
        run: unzip -o artefato/pipeline-demo.zip -d .

      - name: Configurar Python e cache
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Análise estática (Flake8)
        run: python -m flake8 app.py tests_app.py

      - name: Testes e cobertura mínima
        run: >-
          python -m pytest -v tests_app.py
          --cov=app --cov-report=term-missing
          --cov-fail-under=${{ env.COBERTURA_MINIMA }}

  seguranca:
    name: Verificar credenciais expostas
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'

  sonar:
    name: SonarCloud (ativação nas variáveis do repositório)
    needs: [build, qualidade, seguranca]
    if: >-
      vars.SONAR_ENABLED == 'true' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Baixar o artefato do build
        uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: artefato
          merge-multiple: true
      - name: Extrair o artefato
        run: unzip -o artefato/pipeline-demo.zip -d .
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_PADRAO }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Validar configuração do SonarCloud
        run: |
          test -n "$SONAR_TOKEN" || { echo 'Cadastre o secret SONAR_TOKEN.'; exit 1; }
          test -n "$SONAR_PROJECT_KEY" || { echo 'Cadastre a variável SONAR_PROJECT_KEY.'; exit 1; }
          test -n "$SONAR_ORGANIZATION" || { echo 'Cadastre a variável SONAR_ORGANIZATION.'; exit 1; }
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt
      - name: Gerar relatório de cobertura para o SonarCloud
        run: >-
          python -m pytest tests_app.py --cov=app
          --cov-report=xml:coverage.xml
          --cov-fail-under=${{ env.COBERTURA_MINIMA }}
      - name: Analisar no SonarCloud e aguardar Quality Gate
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        with:
          args: >-
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ env.SONAR_ORGANIZATION }}
            -Dsonar.qualitygate.wait=true

  deploy:
    name: Deploy demonstrativo - aprovação manual
    needs: [build, qualidade, seguranca, sonar]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    environment:
      name: production
    steps:
      - name: Baixar o artefato do build
        uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: artefato
          merge-multiple: true
      - name: Extrair o artefato
        run: unzip -o artefato/pipeline-demo.zip -d production

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_PADRAO }}
      - name: Demonstrar execução do pacote aprovado
        run: printf '2\n+\n3\n' | python production/app.py
      - name: Registrar entrega demonstrativa
        run: |
          echo '### Deploy demonstrativo aprovado' >> "$GITHUB_STEP_SUMMARY"
          echo 'O mesmo ZIP do build foi validado e extraído no runner após a aprovação do environment.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Esta demonstração não publica a aplicação em um servidor externo.' >> "$GITHUB_STEP_SUMMARY"
